events {
    worker_connections 1024;
}

http {
    upstream controlnet_backend {
        server controlnet:8000;
    }

    upstream modelguard_backend {
        server model-guard:8001;
    }

    upstream web_frontend {
        server web:8080;
    }

    upstream onnx_service {
        server onnx-service:8002;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        # Increase body size (500MB for model uploads)
        client_max_body_size 500M;

        # Nginx health check
        location /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # ModelGuard API routes (model scanning and reports)
        location /modelguard/ {
            proxy_pass http://modelguard_backend/modelguard/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # ONNX Inference Service
        location /infer {
            proxy_pass http://onnx_service/infer;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_set_header X-Accel-Buffering no;
            chunked_transfer_encoding on;
        }

        # ONNX health and stats
        location ~ ^/(health|cache/stats) {
            proxy_pass http://onnx_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ControlNet Gateway API routes
        location /v1/ {
            proxy_pass http://controlnet_backend/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-Policy-ID $http_x_policy_id;
            proxy_set_header X-Model-ID $http_x_model_id;
            proxy_set_header X-API-KEY $http_x_api_key;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;
            chunked_transfer_encoding on;
        }

        # Next.js API routes
        location /api/ {
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ControlNet docs and health
        location ~ ^/(docs|redoc|openapi.json|readyz) {
            proxy_pass http://controlnet_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Everything else → Next.js
        location / {
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
