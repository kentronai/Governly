events {
    worker_connections 1024;
}

http {
    upstream controlnet_backend {
        server controlnet:8000;
    }

    upstream modelguard_backend {
        server model-guard:8001;
    }

    upstream web_frontend {
        server web:3000;  # Next.js dev server listens on 3000
    }

    upstream onnx_service {
        server onnx-service:8002;
    }

    # WebSocket support for hot reload
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name localhost;

        # Increase body size (500MB for model uploads)
        client_max_body_size 500M;

        # ModelGuard API routes (model scanning and reports)
        location /modelguard/ {
            proxy_pass http://modelguard_backend/modelguard/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;  # 10 minutes for large model scans
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            
            # Disable buffering for large uploads
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # ONNX Inference Service (fast inference with low-latency streaming)
        location /infer {
            proxy_pass http://onnx_service/infer;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Timeouts for inference workloads
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            
            # Critical for low-latency streaming (matches ControlNet)
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_set_header X-Accel-Buffering no;
            chunked_transfer_encoding on;
        }
        
        # ONNX Service health and stats (similar to ControlNet docs/health)
        location ~ ^/(health|cache/stats) {
            proxy_pass http://onnx_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ControlNet Gateway API routes (v1)
        location /v1/ {
            proxy_pass http://controlnet_backend/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CRITICAL: Explicitly forward authentication headers
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-Policy-ID $http_x_policy_id;
            proxy_set_header X-Model-ID $http_x_model_id;
            proxy_set_header X-API-KEY $http_x_api_key;
            
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            
            # Critical for streaming responses (SSE)
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;
            chunked_transfer_encoding on;
        }

        # Next.js API routes (everything under /api/ goes to Next.js)
        location /api/ {
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;

            # Next.js dev can take a long time to compile routes on first hit
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
        }

        # ControlNet docs and health
        location ~ ^/(docs|redoc|openapi.json|healthz|readyz) {
            proxy_pass http://controlnet_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Next.js hot reload WebSocket
        location /_next/webpack-hmr {
            proxy_pass http://web_frontend/_next/webpack-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Everything else goes to Next.js
        location / {
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;

            # Next.js dev can take a long time to compile routes on first hit
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
        }
    }
}
