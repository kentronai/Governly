# Docker Compose for ControlNet Platform - DEVELOPMENT MODE
# Hot reload enabled, dev servers running

services:
  # Nginx Reverse Proxy - Single URL Entry Point
  nginx:
    image: nginx:alpine
    container_name: controlnet-nginx
    restart: unless-stopped
    depends_on:
      controlnet:
        condition: service_started
      model-guard:
        condition: service_started
      web:
        condition: service_healthy
      onnx-service:
        condition: service_started
    ports:
      - "80:80" # ACCESS EVERYTHING HERE
      - "443:443"
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ./apps/web/certificates:/etc/nginx/certificates:ro

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: controlnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_governance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    expose:
      - "5432"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the separate `nango` database on first init (fresh volume only).
      # For an existing volume: docker compose exec postgres createdb -U postgres nango
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_governance"]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: controlnet-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  # Apply every committed Drizzle migration before the web app starts. Without
  # this gate, a newly-added Policy Center column makes the route fail at
  # runtime even though the UI code itself compiled successfully.
  migrate:
    image: node:20-alpine
    container_name: controlnet-migrate
    working_dir: /app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "test -x node_modules/.bin/drizzle-kit || npm install; node scripts/migrate-staged.mjs"

  # ControlNet Gateway (Development Mode)
  controlnet:
    build:
      context: ./apps/controlnet
      dockerfile: Dockerfile
    container_name: controlnet-gateway
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
      - .env.openai.local
      - .env.gemini.local
      - .env.clerk.local
    volumes:
      # Mount source for hot reload
      - ./apps/controlnet:/app
      # Mount ADC credentials from host (~/.config/gcloud created by gcloud CLI)
      - ~/.config/gcloud:/home/controlnet/.config/gcloud:ro
    command: uvicorn gateway.main:app --reload --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz >/dev/null"]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # ONNX Inference Service (Development Mode)
  onnx-service:
    build:
      context: ./apps/onnx-service
      dockerfile: Dockerfile
    container_name: controlnet-onnx-service
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8002"
    ports:
      - "8002:8002"
    env_file:
      - .env
    volumes:
      # Mount source for hot reload
      - ./apps/onnx-service:/app
      # Mount ADC credentials from host (~/.config/gcloud created by gcloud CLI)
      - ~/.config/gcloud:/home/onnx/.config/gcloud:ro
      # Persistent ONNX model storage (shared with controlnet)
      - onnx_model_cache:/app/model_cache
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8002
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8002/health >/dev/null"]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # ModelGuard (Development Mode)
  model-guard:
    build:
      context: ./apps/model-guard
      dockerfile: Dockerfile
    container_name: controlnet-modelguard
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8001"
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      # Mount source for hot reload
      - ./apps/model-guard:/app
      - model_cache:/tmp/model-guard-scans # Persistent cache for downloaded models
      # Mount ADC credentials from host
      - ~/.config/gcloud:/home/modelguard/.config/gcloud:ro
    command: uvicorn gateway.main:app --reload --host 0.0.0.0 --port 8001

  # Next.js Web App (Development Mode)
  web:
    image: node:20-alpine
    container_name: controlnet-web
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 20s
    working_dir: /app
    depends_on:
      controlnet:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    env_file:
      - .env
      - .env.openai.local
      - .env.gemini.local
      # Loaded LAST so it overrides the production (pk_live/sk_live) Clerk keys
      # in .env with the test instance. A pk_live instance is locked to
      # clerk.kentron.ai and rejects https://localhost, which stalls Clerk in an
      # infinite __clerk_handshake loop (blank sign-in). The test instance
      # (adjusted-parakeet-8.clerk.accounts.dev) allows localhost.
      - .env.clerk.local
    environment:
      # Server Actions are internally forwarded back to the request host.
      # Alpine resolves localhost to ::1 first, while Next dev is bound to
      # the IPv4 0.0.0.0 listener, causing ECONNREFUSED ::1:8080.
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      AGENT_DISCOVERY_CRON_SECRET: ${AGENT_DISCOVERY_CRON_SECRET:-norix-local-agent-discovery}
    volumes:
      # Mount source for hot reload
      - ./apps/web:/app
      # Named volumes survive `docker compose down` and prevent a full npm
      # reinstall / cold Next.js cache every time the stack is started.
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    # Use the stable webpack dev server in Docker. Turbopack has intermittently
    # panicked under Docker Desktop bind mounts, which made Nginx return 503 for
    # server actions while the Next process restarted or stopped accepting
    # upstream connections.
    command: sh -c "test -x node_modules/.bin/next || npm install; exec npx next dev --hostname 0.0.0.0 --port 8080"
    healthcheck:
      # Keep the dev healthcheck lightweight. Hitting /api/health during a cold
      # Docker start forces Next to compile the DB/server-action graph and can
      # block real browser pages behind the probe. /favicon.ico proves the dev
      # server is accepting requests without occupying the route compiler.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/favicon.ico"]
      interval: 30s
      start_interval: 2s
      timeout: 30s
      retries: 12
      start_period: 60s

  # Polls hourly; the route only scans a source whose last scan is older than
  # AGENT_DISCOVERY_INTERVAL_HOURS (default 24), so restarts never trigger a scan.
  agent-discovery-scheduler:
    image: alpine:3.20
    container_name: controlnet-agent-discovery-scheduler
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      AGENT_DISCOVERY_CRON_SECRET: ${AGENT_DISCOVERY_CRON_SECRET:-norix-local-agent-discovery}
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          echo "[$$(date -Iseconds)] agent-discovery: starting run"
          # Never swallow the result: a bare `|| true` here hid the fact that
          # every run was being redirected to /sign-in and discovery had never
          # actually executed. Keep the loop alive, but say so when it fails.
          if wget -qO- --timeout=900 \
            --header="Authorization: Bearer $${AGENT_DISCOVERY_CRON_SECRET}" \
            http://web:8080/api/cron/agent-discovery; then
            echo ""
            echo "[$$(date -Iseconds)] agent-discovery: run finished"
          else
            echo "[$$(date -Iseconds)] agent-discovery: RUN FAILED (exit $$?)" >&2
          fi
          sleep 3600
        done

  # AI Radar scheduler. Polls hourly; the endpoint itself only starts a sweep
  # when the last one is older than RADAR_INTERVAL_HOURS (default 72 = every
  # 3 days), so restarts/redeploys never trigger an early run.
  ai-radar-scheduler:
    image: alpine:3.20
    container_name: controlnet-ai-radar-scheduler
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      AGENT_DISCOVERY_CRON_SECRET: ${AGENT_DISCOVERY_CRON_SECRET:-norix-local-agent-discovery}
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          wget -qO- --timeout=60 \
            --header="Authorization: Bearer $${AGENT_DISCOVERY_CRON_SECRET}" \
            http://web:8080/api/cron/ai-radar || true
          sleep 3600
        done

  # Trust Dossier agent scheduler. Polls hourly; the endpoint only starts a sweep
  # on Saturdays (from 02:00 UTC), once a week, so restarts never trigger an early run.
  trust-dossier-scheduler:
    image: alpine:3.20
    container_name: controlnet-trust-dossier-scheduler
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      AGENT_DISCOVERY_CRON_SECRET: ${AGENT_DISCOVERY_CRON_SECRET:-norix-local-agent-discovery}
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          wget -qO- --timeout=60 \
            --header="Authorization: Bearer $${AGENT_DISCOVERY_CRON_SECRET}" \
            http://web:8080/api/cron/trust-dossier || true
          sleep 3600
        done

  # ------------------------------------------------------------------
  # Self-hosted Nango (open-source, free — no Nango cloud account).
  # Same Auth + Proxy layer as prod; NORIX web reaches it at
  # http://nango-server:3003 over the internal compose network. The
  # dashboard is exposed on localhost:3003 in dev for local setup.
  #
  # DB: reuses NORIX's own `postgres` service in a separate `nango` database
  # (created by db/init/01-create-nango-db.sql — the dev postgres already
  # mounts ./db/init below). Redis stays isolated (nango-redis).
  # ------------------------------------------------------------------
  nango-redis:
    image: redis:7-alpine
    container_name: controlnet-nango-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - nango_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  nango-server:
    image: nangohq/nango-server:hosted
    container_name: controlnet-nango-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nango-redis:
        condition: service_healthy
    expose:
      - "3003"
      - "3009"
    ports:
      - "3003:3003" # API + dashboard at http://localhost:3003
      - "3009:3009" # Connect UI (the popup) at http://localhost:3009
    volumes:
      # Vendored Nango provider templates + NORIX's custom `azure-service-principal`
      # provider (labeled tenant/subscription/client/secret fields in the popup).
      - ./nango/providers.yaml:/app/nango/packages/providers/providers.yaml:ro
    environment:
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY:?NANGO_ENCRYPTION_KEY must be a base64 32-byte key}
      # The single hosted image also serves the Connect UI (the popup) on 3009.
      # These must be BROWSER-reachable URLs or the popup stays blank (#5432).
      FLAG_SERVE_CONNECT_UI: "true"
      NANGO_PUBLIC_SERVER_URL: ${NANGO_PUBLIC_SERVER_URL:-http://localhost:3003}
      NANGO_PUBLIC_CONNECT_URL: ${NANGO_PUBLIC_CONNECT_URL:-http://localhost:3009}
      # Reuse NORIX's own postgres, but a separate `nango` database.
      NANGO_DB_HOST: postgres
      NANGO_DB_PORT: "5432"
      NANGO_DB_NAME: nango
      NANGO_DB_USER: postgres
      NANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      NANGO_DB_SSL: "false"
      NANGO_REDIS_URL: redis://nango-redis:6379
      NANGO_SERVER_URL: ${NANGO_SERVER_URL:-http://localhost:3003}
      # The :hosted image bakes PORT=8080; force both so the server actually
      # listens on 3003 (matches the healthcheck, port map, and NANGO_HOST).
      PORT: "3003"
      SERVER_PORT: "3003"
      # Pre-set the dev-environment secret key so NORIX (NANGO_SECRET_KEY) and
      # the server share the same value — no dashboard copy step needed.
      NANGO_SECRET_KEY_DEV: ${NANGO_SECRET_KEY:?NANGO_SECRET_KEY must be set}
      NANGO_DASHBOARD_USERNAME: ${NANGO_DASHBOARD_USERNAME:-admin}
      NANGO_DASHBOARD_PASSWORD: ${NANGO_DASHBOARD_PASSWORD:-admin}
      TELEMETRY: "false"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

volumes:
  postgres_data: # Persistent PostgreSQL data
  redis_data:
  model_cache: # Persistent storage for ModelGuard scans
  onnx_model_cache: # Persistent storage for ONNX models (survives container restarts)
  nango_redis_data: # Nango orchestration/queue state (credentials live in the `nango` DB on postgres)
  # Declared external so Compose adopts the existing volumes instead of warning
  # that it did not create them. Both are created idempotently by
  # start_local_dev.sh and `./dev up`; create them by hand with
  #   docker volume create norix-web-node-modules
  #   docker volume create norix-web-next-cache
  # if you invoke docker compose directly on a fresh machine.
  web_node_modules: # Persistent web dependencies (avoids npm install on every start)
    external: true
    name: norix-web-node-modules
  web_next_cache: # Persistent Next.js compilation cache
    external: true
    name: norix-web-next-cache

networks:
  default:
    name: controlnet-network
