# Docker Compose for ControlNet Platform - DEVELOPMENT MODE
# Hot reload enabled, dev servers running

services:
  # Nginx Reverse Proxy - Single URL Entry Point
  nginx:
    image: nginx:alpine
    container_name: controlnet-nginx
    restart: unless-stopped
    depends_on:
      controlnet:
        condition: service_started
      model-guard:
        condition: service_started
      web:
        condition: service_healthy
      onnx-service:
        condition: service_started
    ports:
      - "80:80" # ACCESS EVERYTHING HERE
      - "443:443"
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ./apps/web/certificates:/etc/nginx/certificates:ro

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: controlnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_governance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    expose:
      - "5432"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_governance"]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: controlnet-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  # Apply every committed Drizzle migration before the web app starts. Without
  # this gate, a newly-added Policy Center column makes the route fail at
  # runtime even though the UI code itself compiled successfully.
  migrate:
    image: node:20-alpine
    container_name: controlnet-migrate
    working_dir: /app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "test -x node_modules/.bin/drizzle-kit || npm install; npx drizzle-kit migrate --config=src/drizzle.config.ts"

  # ControlNet Gateway (Development Mode)
  controlnet:
    build:
      context: ./apps/controlnet
      dockerfile: Dockerfile
    container_name: controlnet-gateway
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
      - .env.openai.local
      - .env.gemini.local
      - .env.clerk.local
    volumes:
      # Mount source for hot reload
      - ./apps/controlnet:/app
      # Mount ADC credentials from host (~/.config/gcloud created by gcloud CLI)
      - ~/.config/gcloud:/home/controlnet/.config/gcloud:ro
    command: uvicorn gateway.main:app --reload --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz >/dev/null"]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # ONNX Inference Service (Development Mode)
  onnx-service:
    build:
      context: ./apps/onnx-service
      dockerfile: Dockerfile
    container_name: controlnet-onnx-service
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8002"
    ports:
      - "8002:8002"
    env_file:
      - .env
    volumes:
      # Mount source for hot reload
      - ./apps/onnx-service:/app
      # Mount ADC credentials from host (~/.config/gcloud created by gcloud CLI)
      - ~/.config/gcloud:/home/onnx/.config/gcloud:ro
      # Persistent ONNX model storage (shared with controlnet)
      - onnx_model_cache:/app/model_cache
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8002
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8002/health >/dev/null"]
      interval: 30s
      start_interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  # ModelGuard (Development Mode)
  model-guard:
    build:
      context: ./apps/model-guard
      dockerfile: Dockerfile
    container_name: controlnet-modelguard
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8001"
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      # Mount source for hot reload
      - ./apps/model-guard:/app
      - model_cache:/tmp/model-guard-scans # Persistent cache for downloaded models
      # Mount ADC credentials from host
      - ~/.config/gcloud:/home/modelguard/.config/gcloud:ro
    command: uvicorn gateway.main:app --reload --host 0.0.0.0 --port 8001

  # Next.js Web App (Development Mode)
  web:
    image: node:20-alpine
    container_name: controlnet-web
    init: true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 20s
    working_dir: /app
    depends_on:
      controlnet:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    env_file:
      - .env
      - .env.openai.local
      - .env.gemini.local
    environment:
      # Server Actions are internally forwarded back to the request host.
      # Alpine resolves localhost to ::1 first, while Next dev is bound to
      # the IPv4 0.0.0.0 listener, causing ECONNREFUSED ::1:8080.
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      AGENT_DISCOVERY_CRON_SECRET: ${AGENT_DISCOVERY_CRON_SECRET:-norix-local-agent-discovery}
    volumes:
      # Mount source for hot reload
      - ./apps/web:/app
      # Named volumes survive `docker compose down` and prevent a full npm
      # reinstall / cold Turbopack cache every time the stack is started.
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    # Turbopack reduces the memory and cold-compilation pressure of this large
    # Next.js app. Its cache persists in web_next_cache across container restarts.
    command: sh -c "test -x node_modules/.bin/next || npm install; exec npx next dev --turbopack --hostname 0.0.0.0 --port 8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/sign-in"]
      interval: 30s
      start_interval: 2s
      timeout: 60s
      retries: 12
      start_period: 2s

  # Continuously refresh every connected cloud account. The first refresh runs
  # as soon as the web service is healthy; later refreshes run at the configured
  # interval and wait for the previous run to finish, so scans cannot overlap.
  agent-discovery-scheduler:
    image: alpine:3.20
    container_name: controlnet-agent-discovery-scheduler
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      AGENT_DISCOVERY_CRON_SECRET: ${AGENT_DISCOVERY_CRON_SECRET:-norix-local-agent-discovery}
      AGENT_DISCOVERY_INTERVAL_SECONDS: ${AGENT_DISCOVERY_INTERVAL_SECONDS:-300}
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          echo "[$$(date -Iseconds)] agent-discovery: starting run"
          # Never swallow the result: a bare `|| true` here hid the fact that
          # every run was being redirected to /sign-in and discovery had never
          # actually executed. Keep the loop alive, but say so when it fails.
          if wget -qO- --timeout=900 \
            --header="Authorization: Bearer $${AGENT_DISCOVERY_CRON_SECRET}" \
            http://web:8080/api/cron/agent-discovery; then
            echo ""
            echo "[$$(date -Iseconds)] agent-discovery: run finished"
          else
            echo "[$$(date -Iseconds)] agent-discovery: RUN FAILED (exit $$?)" >&2
          fi
          sleep "$${AGENT_DISCOVERY_INTERVAL_SECONDS}"
        done

volumes:
  postgres_data: # Persistent PostgreSQL data
  redis_data:
  model_cache: # Persistent storage for ModelGuard scans
  onnx_model_cache: # Persistent storage for ONNX models (survives container restarts)
  # Declared external so Compose adopts the existing volumes instead of warning
  # that it did not create them. Both are created idempotently by
  # start_local_dev.sh and `./dev up`; create them by hand with
  #   docker volume create norix-web-node-modules
  #   docker volume create norix-web-next-cache
  # if you invoke docker compose directly on a fresh machine.
  web_node_modules: # Persistent web dependencies (avoids npm install on every start)
    external: true
    name: norix-web-node-modules
  web_next_cache: # Persistent Turbopack compilation cache
    external: true
    name: norix-web-next-cache

networks:
  default:
    name: controlnet-network
