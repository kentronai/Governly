[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "controlnet"
version = "1.7.4"
description = "Composable Guard Algebra (CGA) with OpenAI-compatible gateway and SDK"
# readme = "README.md"  # Optional - removed for Docker builds
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "AI Governance Team"},
]
keywords = ["ai", "guardrails", "safety", "llm", "gateway", "proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core dependencies
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx[http2]>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.1",
    "jsonpath-ng[ext]>=1.6.0",
    "jsonschema>=4.20.0",
    "regex>=2023.0.0",
    "structlog>=23.2.0",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    # Redis and caching
    "redis>=5.0.0",
    # Embedding Router dependencies (Layer 0)
    "sentence-transformers>=3.3.0",
    "torch>=2.0.0,<3.0.0",
    "numpy>=2.3.3",
    "huggingface-hub>=0.20.0",
    # LanceDB for risk detection (vector store)
    "lancedb>=0.6.0",
    "pyarrow>=14.0.0",
    # Development dependencies
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "sqlalchemy>=2.0.43",
    "asyncpg>=0.30.0",
    "openai>=2.0.0",
    "greenlet>=3.2.4",
    "langchain-community>=0.3.30",
    "pypdf>=6.1.1",
    # JWT validation for Clerk authentication
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=41.0.0",
    "httpx>=0.25.0",
    "psycopg2-binary>=2.9.10",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "google-cloud-storage>=3.4.0",
    "boto3>=1.34.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]
gateway = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx[http2]>=0.25.0",
    "redis>=5.0.0",
    "structlog>=23.2.0",
]
sdk = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.1",
    "jsonpath-ng>=1.6.0",
    "jsonschema>=4.20.0",
    "regex>=2023.0.0",
]

[project.scripts]
guardrails-gateway = "gateway.main:main"

[project.urls]
Homepage = "https://github.com/ai-governance/ai-governance"
Documentation = "https://github.com/ai-governance/ai-governance#readme"
Repository = "https://github.com/ai-governance/ai-governance.git"
Issues = "https://github.com/ai-governance/ai-governance/issues"

[tool.hatch.build.targets.wheel]
packages = [
    "gateway",
    "cga_core", 
    "guard_packs",
    "policies",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "pyre2.*",
    "jsonpath_ng.*",
    "onnxruntime.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=gateway",
    "--cov=cga_core", 
    "--cov=guard_packs",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["gateway", "cga_core", "guard_packs"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
