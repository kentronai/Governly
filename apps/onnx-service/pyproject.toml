[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onnx-service"
version = "0.1.0"
description = "High-performance ONNX inference service for AI governance"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "AI Governance Team"},
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "onnxruntime>=1.16.3",
    "transformers>=4.35.2",
    "numpy>=1.24.3",
    "google-cloud-storage>=2.10.0",
    "boto3>=1.34.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "asyncpg>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.1",
    "structlog>=24.1.0",
    "sentencepiece>=0.1.99",  # Required for DeBERTa tokenizers (PII model)
]

[tool.hatch.build.targets.wheel]
packages = ["."]

