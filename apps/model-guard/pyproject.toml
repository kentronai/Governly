[project]
name = "model-guard"
version = "1.8.0"
description = "AI Model Security Scanner for Kentron AI Governance Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.23",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "httpx>=0.25.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.0",
    # ML model format libraries
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "torch>=2.1.0",
    "tensorflow>=2.15.0",
    "safetensors>=0.4.0",
    "h5py>=3.10.0",
    "protobuf>=4.25.0",
    "huggingface-hub>=0.19.0",
    "boto3>=1.34.0",
    # Utilities
    "python-magic>=0.4.27",
    "typer>=0.9.0",
    "rich>=13.7.0",
    # Security scanning
    "fickling>=0.0.6",  # Advanced pickle analysis
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = [
    "gateway",
    "modelguard_core",
    "services",
    "adapters",
    "schemas"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
