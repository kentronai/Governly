# Docker Compose for ControlNet Platform
# Single URL via nginx reverse proxy

services:
  # Nginx Reverse Proxy - Single Entry Point
  nginx:
    image: nginx:alpine
    container_name: controlnet-nginx
    restart: unless-stopped
    depends_on:
      controlnet:
        condition: service_healthy
      web:
        condition: service_healthy
      onnx-service:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      # Use the IPv4 loopback explicitly: inside the container `localhost` can
      # resolve to IPv6 ::1 first, but our nginx.conf only `listen 80;` (IPv4),
      # so wget to ::1:80 is refused and the check flaps forever.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: controlnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_governance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      # Performance tuning for production
      POSTGRES_SHARED_BUFFERS: "256MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "1GB"
      POSTGRES_MAX_CONNECTIONS: "100"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the separate `nango` database on first init so self-hosted
      # Nango can share this postgres server. Runs only on a fresh volume;
      # for existing volumes run: docker compose exec postgres createdb -U postgres nango
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_governance"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: controlnet-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ControlNet Gateway
  controlnet:
    image: ai-governance-controlnet:latest
    build:
      context: ./apps/controlnet
      dockerfile: Dockerfile
    container_name: controlnet-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000" # Internal only
    env_file:
      - .env
    volumes:
      - ./apps/controlnet/policies:/app/policies
      - ./apps/controlnet/guard_packs:/app/guard_packs
      # Bind-mount the new Python source over the cached image so GCS→S3
      # changes take effect without a rebuild (interpreter reads at startup).
      - ./apps/controlnet/gateway:/app/gateway:ro
      - ./apps/controlnet/cga_core:/app/cga_core:ro
      - onnx_model_cache:/app/model_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ONNX Inference Service
  onnx-service:
    image: ai-governance-onnx-service:latest
    build:
      context: ./apps/onnx-service
      dockerfile: Dockerfile
    container_name: controlnet-onnx-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8002" # Internal only
    env_file:
      - .env
    volumes:
      - onnx_model_cache:/app/model_cache
      # Bind-mount the only-changed top-level Python file. Need to mount each
      # file individually because the cached image has additional generated
      # files in /app that we shouldn't shadow with a directory mount.
      - ./apps/onnx-service/main.py:/app/main.py:ro
      - ./apps/onnx-service/config.py:/app/config.py:ro
      - ./apps/onnx-service/model_loader.py:/app/model_loader.py:ro
      - ./apps/onnx-service/inference.py:/app/inference.py:ro
      - ./apps/onnx-service/cache.py:/app/cache.py:ro
      - ./apps/onnx-service/db.py:/app/db.py:ro
      - ./apps/onnx-service/middleware.py:/app/middleware.py:ro
      - ./apps/onnx-service/logging_config.py:/app/logging_config.py:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Next.js Web App
  web:
    image: ai-governance-web:latest
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runner
      args:
        # Bake NEXT_PUBLIC_* into the client bundle at build time. Compose
        # substitutes from the .env file in the same directory.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
        DATABASE_URL: ${DATABASE_URL}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PLAYGROUND_REQUEST_URL: ${NEXT_PUBLIC_PLAYGROUND_REQUEST_URL:-}
        NEXT_PUBLIC_CONTROLNET_GATEWAY_URL: ${NEXT_PUBLIC_CONTROLNET_GATEWAY_URL:-}
        NEXT_PUBLIC_STATIC_FILES_BUCKET: ${NEXT_PUBLIC_STATIC_FILES_BUCKET:-}
        NEXT_PUBLIC_STATIC_FILES_REGION: ${NEXT_PUBLIC_STATIC_FILES_REGION:-us-east-1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-}
        NEXT_PUBLIC_TENANT_NAME: ${NEXT_PUBLIC_TENANT_NAME:-}
        NEXT_PUBLIC_TENANT_NAME_AI: ${NEXT_PUBLIC_TENANT_NAME_AI:-}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-}
        NEXT_PUBLIC_BASE_URL_AI: ${NEXT_PUBLIC_BASE_URL_AI:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
        NEXT_PUBLIC_NANGO_API_URL: ${NEXT_PUBLIC_NANGO_API_URL:-}
        NEXT_PUBLIC_NANGO_CONNECT_URL: ${NEXT_PUBLIC_NANGO_CONNECT_URL:-}
        NEXT_PUBLIC_NANGO_FRONTEND_URL: ${NEXT_PUBLIC_NANGO_FRONTEND_URL:-}
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    container_name: controlnet-web
    restart: unless-stopped
    depends_on:
      controlnet:
        condition: service_healthy
    expose:
      - "8080" # Internal only
    env_file:
      - .env
      # Optional: provider client ids/secrets, see .env.integrations.example
      - path: .env.integrations
        required: false
    environment:
      # Force Next.js standalone server to bind to all interfaces, not the
      # container's auto-assigned hostname (which makes localhost:8080 from
      # inside the container fail with "connection refused").
      HOSTNAME: "0.0.0.0"
      AGENT_DISCOVERY_CRON_SECRET: ${AGENT_DISCOVERY_CRON_SECRET:?AGENT_DISCOVERY_CRON_SECRET must be configured}
    healthcheck:
      # node:20-alpine has wget but not curl. /api/health may 404 if route is
      # missing in this build, so accept any 2xx/3xx response from /.
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "--tries=1",
          "--timeout=5",
          "http://127.0.0.1:8080/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Production recurring discovery worker. Polls the authenticated internal
  # route hourly; the route only scans a source whose last scan is older than
  # AGENT_DISCOVERY_INTERVAL_HOURS (default 24), so restarts never trigger a scan.
  agent-discovery-scheduler:
    image: alpine:3.20
    container_name: controlnet-agent-discovery-scheduler
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AGENT_DISCOVERY_CRON_SECRET: ${AGENT_DISCOVERY_CRON_SECRET:?AGENT_DISCOVERY_CRON_SECRET must be configured}
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          wget -qO- --timeout=900 \
            --header="Authorization: Bearer $${AGENT_DISCOVERY_CRON_SECRET}" \
            http://web:8080/api/cron/agent-discovery || true
          sleep 3600
        done

  # AI Radar scheduler. Polls hourly; the endpoint itself only starts a sweep
  # when the last one is older than RADAR_INTERVAL_HOURS (default 72 = every
  # 3 days), so restarts/redeploys never trigger an early run.
  ai-radar-scheduler:
    image: alpine:3.20
    container_name: controlnet-ai-radar-scheduler
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      AGENT_DISCOVERY_CRON_SECRET: ${AGENT_DISCOVERY_CRON_SECRET:?AGENT_DISCOVERY_CRON_SECRET must be configured}
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          wget -qO- --timeout=60 \
            --header="Authorization: Bearer $${AGENT_DISCOVERY_CRON_SECRET}" \
            http://web:8080/api/cron/ai-radar || true
          sleep 3600
        done

  # Trust Dossier agent scheduler. Polls hourly; the endpoint only starts a sweep
  # on Saturdays (from 02:00 UTC), once a week, so restarts never trigger an early run.
  trust-dossier-scheduler:
    image: alpine:3.20
    container_name: controlnet-trust-dossier-scheduler
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      AGENT_DISCOVERY_CRON_SECRET: ${AGENT_DISCOVERY_CRON_SECRET:?AGENT_DISCOVERY_CRON_SECRET must be configured}
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          wget -qO- --timeout=60 \
            --header="Authorization: Bearer $${AGENT_DISCOVERY_CRON_SECRET}" \
            http://web:8080/api/cron/trust-dossier || true
          sleep 3600
        done

  # ------------------------------------------------------------------
  # Self-hosted Nango (open-source, free — no Nango cloud account).
  # Provides the Auth + Proxy layer: OAuth flows, an encrypted credential
  # vault, automatic token refresh, and authenticated proxy calls. NORIX
  # reaches it over the internal compose network at http://nango-server:3003.
  #
  # DB ownership: Nango uses NORIX's OWN `postgres` service, in a SEPARATE
  # `nango` database (created by db/init/01-create-nango-db.sql). No dedicated
  # Nango Postgres container. Redis stays isolated (nango-redis) to avoid key
  # collisions with the app cache.
  # ------------------------------------------------------------------
  nango-redis:
    image: redis:7-alpine
    container_name: controlnet-nango-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - nango_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nango-server:
    image: nangohq/nango-server:hosted
    container_name: controlnet-nango-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nango-redis:
        condition: service_healthy
    expose:
      - "3003" # Internal only — NORIX web talks to it over the compose network
      - "3009" # Connect UI (the popup) — nginx proxies /nango-connect/ here
    volumes:
      # Custom provider templates (aws-iam, azure-service-principal, etc.) the
      # NORIX Connect popups rely on — mounted so they exist alongside the
      # built-in catalog (matches the dev compose).
      - ./nango/providers.yaml:/app/nango/packages/providers/providers.yaml:ro
    environment:
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY:?NANGO_ENCRYPTION_KEY must be a base64 32-byte key}
      # Serve the Connect UI (the popup) on 3009, as docker-compose.dev.yml does.
      # Without this the image only serves the API + dashboard on 3003 and the
      # popup does not exist at all — /nango-connect/ then lands on the
      # dashboard SPA, which renders as a blank page inside the iframe.
      FLAG_SERVE_CONNECT_UI: "true"
      # Reuse NORIX's own postgres, but a separate `nango` database.
      NANGO_DB_HOST: postgres
      NANGO_DB_PORT: "5432"
      NANGO_DB_NAME: nango
      NANGO_DB_USER: postgres
      NANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      NANGO_DB_SSL: "false"
      NANGO_REDIS_URL: redis://nango-redis:6379
      # Public base URL of this Nango server (used in webhook/redirect URLs).
      NANGO_SERVER_URL: ${NANGO_SERVER_URL:-http://nango-server:3003}
      # Browser-facing URLs so the Connect popup + SDK talk to this self-hosted
      # server (not Nango Cloud). Served via nginx sub-paths on the app origin.
      NANGO_PUBLIC_SERVER_URL: ${NANGO_PUBLIC_SERVER_URL:-http://nango-server:3003}
      NANGO_PUBLIC_CONNECT_URL: ${NANGO_PUBLIC_CONNECT_URL:-http://localhost:3009}
      # The :hosted image bakes PORT=8080; force both so the server actually
      # listens on 3003 (matches the healthcheck, port map, and NANGO_HOST).
      PORT: "3003"
      SERVER_PORT: "3003"
      # Pre-set the dev-environment secret key so NORIX (NANGO_SECRET_KEY) and
      # the server share the same value — no dashboard copy step needed.
      NANGO_SECRET_KEY_DEV: ${NANGO_SECRET_KEY:?NANGO_SECRET_KEY must be set}
      # Basic-auth for the self-hosted Nango dashboard (no cloud login).
      NANGO_DASHBOARD_USERNAME: ${NANGO_DASHBOARD_USERNAME:-admin}
      NANGO_DASHBOARD_PASSWORD: ${NANGO_DASHBOARD_PASSWORD:-admin}
      TELEMETRY: "false"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data: # Persistent PostgreSQL data
  redis_data:
  onnx_model_cache:  # Persistent storage for ONNX models (survives container restarts)
  nango_redis_data: # Nango orchestration/queue state (credentials live in the `nango` DB on postgres)

networks:
  default:
    name: controlnet-network
