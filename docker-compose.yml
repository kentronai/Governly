# Docker Compose for ControlNet Platform
# Single URL via nginx reverse proxy

services:
  # Nginx Reverse Proxy - Single Entry Point
  nginx:
    image: nginx:alpine
    container_name: controlnet-nginx
    restart: unless-stopped
    depends_on:
      controlnet:
        condition: service_healthy
      model-guard:
        condition: service_healthy
      web:
        condition: service_healthy
      onnx-service:
        condition: service_healthy
    ports:
      - "80:80"  # Single port for everything
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: controlnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_governance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      # Performance tuning for production
      POSTGRES_SHARED_BUFFERS: "256MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "1GB"
      POSTGRES_MAX_CONNECTIONS: "100"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_governance"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: 
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: controlnet-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ControlNet Gateway
  controlnet:
    build:
      context: ./apps/controlnet
      dockerfile: Dockerfile
    container_name: controlnet-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"  # Internal only
    env_file:
      - .env
    volumes:
      - ./apps/controlnet/policies:/app/policies
      - ./apps/controlnet/guard_packs:/app/guard_packs
      # Mount ADC credentials from host (~/.config/gcloud created by gcloud CLI)
      - ~/.config/gcloud:/home/controlnet/.config/gcloud:ro
      - onnx_model_cache:/app/model_cache  # Persistent ONNX model storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ModelGuard Service
  model-guard:
    build:
      context: ./apps/model-guard
      dockerfile: Dockerfile
    container_name: controlnet-modelguard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8001"  # Internal only
    env_file:
      - .env
    volumes:
      - model_cache:/tmp/model-guard-scans  # Persistent cache for downloaded models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ONNX Inference Service
  onnx-service:
    build:
      context: ./apps/onnx-service
      dockerfile: Dockerfile
    container_name: controlnet-onnx-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8002"  # Internal only
    env_file:
      - .env
    volumes:
      - ~/.config/gcloud:/home/onnx/.config/gcloud:ro
      - onnx_model_cache:/app/model_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Allow time to load models

  # Next.js Web App
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runner
    container_name: controlnet-web
    restart: unless-stopped
    depends_on:
      controlnet:
        condition: service_healthy
    expose:
      - "8080"  # Internal only
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:  # Persistent PostgreSQL data
  redis_data:
  model_cache:  # Persistent storage for ModelGuard scans
  onnx_model_cache:  # Persistent storage for ONNX models (survives container restarts)

networks:
  default:
    name: controlnet-network