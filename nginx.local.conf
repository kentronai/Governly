events {
    worker_connections 1024;
}

http {
    # Docker container IPs can change after a hot-reload/recreate. Resolve
    # service names continuously so Nginx never retains a stale upstream IP.
    resolver 127.0.0.11 valid=2s ipv6=off;
    upstream controlnet_backend {
        zone controlnet_backend 64k;
        server controlnet:8000 resolve;
    }
    upstream modelguard_backend {
        zone modelguard_backend 64k;
        server model-guard:8001 resolve;
    }
    upstream web_frontend {
        zone web_frontend 64k;
        # max_fails=0 disables passive failure marking. With the default
        # (max_fails=1 fail_timeout=10s) a single refused connection while the
        # Next.js dev server restarts takes the upstream out for a further 10s,
        # so a ~3s restart surfaced as a ~13s wall of 502s.
        server web:8080 resolve max_fails=0;
    }
    upstream onnx_service {
        zone onnx_service 64k;
        server onnx-service:8002 resolve;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name www.kentron.ai;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name www.kentron.ai;
        ssl_certificate /etc/nginx/certificates/www.kentron.ai.pem;
        ssl_certificate_key /etc/nginx/certificates/www.kentron.ai-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 500M;

        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location /modelguard/ {
            proxy_pass http://modelguard_backend/modelguard/;
            proxy_read_timeout 600s;
            proxy_request_buffering off;
        }

        location /infer {
            proxy_pass http://onnx_service/infer;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location ~ ^/(health|cache/stats) {
            proxy_pass http://onnx_service;
        }

        location /v1/ {
            proxy_pass http://controlnet_backend/v1/;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-Policy-ID $http_x_policy_id;
            proxy_set_header X-Model-ID $http_x_model_id;
            proxy_set_header X-API-KEY $http_x_api_key;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location ~ ^/(docs|redoc|openapi.json|readyz) {
            proxy_pass http://controlnet_backend;
        }

        # Shown instead of a bare "502 Bad Gateway" while the dev server is
        # restarting (editing middleware.ts or next.config.js restarts Next.js
        # entirely). Auto-reloads, so the browser recovers on its own.
        location = /__web-starting.html {
            internal;
            add_header Content-Type text/html always;
            add_header Retry-After 2 always;
            return 503 '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="2"><title>Starting</title><body style="font:15px system-ui;display:grid;place-items:center;height:100vh;margin:0"><div style="text-align:center"><p><strong>Dev server is restarting</strong></p><p>This page reloads itself.</p></div>';
        }

        location / {
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;

            proxy_intercept_errors on;
            error_page 502 504 = /__web-starting.html;
        }
    }
}
