events {
    worker_connections 1024;
}

http {
    upstream controlnet_backend { server controlnet:8000; }
    upstream modelguard_backend { server model-guard:8001; }
    # Run Next.js on the host during development. Docker Desktop bind mounts
    # make this large app's cold compilation and file watching much slower.
    upstream web_frontend { server host.docker.internal:3001; }
    upstream onnx_service { server onnx-service:8002; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name www.kentron.ai;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name www.kentron.ai;
        ssl_certificate /etc/nginx/certificates/www.kentron.ai.pem;
        ssl_certificate_key /etc/nginx/certificates/www.kentron.ai-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 500M;

        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location /modelguard/ {
            proxy_pass http://modelguard_backend/modelguard/;
            proxy_read_timeout 600s;
            proxy_request_buffering off;
        }

        location /infer {
            proxy_pass http://onnx_service/infer;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location ~ ^/(health|cache/stats) {
            proxy_pass http://onnx_service;
        }

        location /v1/ {
            proxy_pass http://controlnet_backend/v1/;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-Policy-ID $http_x_policy_id;
            proxy_set_header X-Model-ID $http_x_model_id;
            proxy_set_header X-API-KEY $http_x_api_key;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location ~ ^/(docs|redoc|openapi.json|readyz) {
            proxy_pass http://controlnet_backend;
        }

        location / {
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
        }
    }
}
