# Cloud Build Configuration for CI/CD
# Builds and deploys: ControlNet Gateway, ModelGuard, and Web App

steps:
  # Build ControlNet Gateway
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-controlnet'
    secretEnv:
      - 'CLERK_PUBLISHABLE_KEY'
      - 'CLERK_SECRET_KEY'
      - 'DATABASE_URL'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg NEXT_PUBLIC_BACKEND_URL=https://${_PLATFORM_DOMAIN} \
          --build-arg NEXT_PUBLIC_PLAYGROUND_REQUEST_URL=https://${_PLATFORM_DOMAIN} \
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$$CLERK_PUBLISHABLE_KEY \
          --build-arg CLERK_SECRET_KEY=$$CLERK_SECRET_KEY \
          --build-arg DATABASE_URL=$$DATABASE_URL \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/controlnet:${_IMAGE_TAG} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/controlnet:latest \
          -f apps/controlnet/Dockerfile \
          apps/controlnet

  # Build ModelGuard
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-modelguard'
    secretEnv:
      - 'CLERK_PUBLISHABLE_KEY'
      - 'CLERK_SECRET_KEY'
      - 'DATABASE_URL'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg NEXT_PUBLIC_BACKEND_URL=https://${_PLATFORM_DOMAIN} \
          --build-arg NEXT_PUBLIC_PLAYGROUND_REQUEST_URL=https://${_PLATFORM_DOMAIN} \
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$$CLERK_PUBLISHABLE_KEY \
          --build-arg CLERK_SECRET_KEY=$$CLERK_SECRET_KEY \
          --build-arg DATABASE_URL=$$DATABASE_URL \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/model-guard:${_IMAGE_TAG} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/model-guard:latest \
          -f apps/model-guard/Dockerfile \
          apps/model-guard

  # Build Web App
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-web'
    secretEnv:
      - 'CLERK_PUBLISHABLE_KEY'
      - 'CLERK_SECRET_KEY'
      - 'DATABASE_URL'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$$CLERK_PUBLISHABLE_KEY \
          --build-arg CLERK_SECRET_KEY=$$CLERK_SECRET_KEY \
          --build-arg DATABASE_URL=$$DATABASE_URL \
          --build-arg NEXT_PUBLIC_PLAYGROUND_REQUEST_URL=https://${_PLATFORM_DOMAIN} \
          --build-arg NEXT_PUBLIC_BACKEND_URL=https://${_PLATFORM_DOMAIN} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/web:${_IMAGE_TAG} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/web:latest \
          -f apps/web/Dockerfile \
          apps/web

  # Build ONNX Inference Service
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-onnx'
    secretEnv:
      - 'CLERK_PUBLISHABLE_KEY'
      - 'CLERK_SECRET_KEY'
      - 'DATABASE_URL'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg NEXT_PUBLIC_BACKEND_URL=https://${_PLATFORM_DOMAIN} \
          --build-arg NEXT_PUBLIC_PLAYGROUND_REQUEST_URL=https://${_PLATFORM_DOMAIN} \
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$$CLERK_PUBLISHABLE_KEY \
          --build-arg CLERK_SECRET_KEY=$$CLERK_SECRET_KEY \
          --build-arg DATABASE_URL=$$DATABASE_URL \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/onnx-inference-service-${_ENVIRONMENT}:${_IMAGE_TAG} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/onnx-inference-service-${_ENVIRONMENT}:latest \
          -f apps/onnx-service/Dockerfile \
          apps/onnx-service

  # Push ControlNet image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-controlnet'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/controlnet:${_IMAGE_TAG}
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/controlnet:latest
    waitFor: ['build-controlnet']

  # Push ModelGuard image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-modelguard'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/model-guard:${_IMAGE_TAG}
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/model-guard:latest
    waitFor: ['build-modelguard']

  # Push Web image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-web'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/web:${_IMAGE_TAG}
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/web:latest
    waitFor: ['build-web']

  # Push ONNX image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-onnx'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/onnx-inference-service-${_ENVIRONMENT}:${_IMAGE_TAG}
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-governance/onnx-inference-service-${_ENVIRONMENT}:latest
    waitFor: ['build-onnx']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'ensure-state-bucket'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        STATE_BUCKET="${PROJECT_ID}-terraform-state"
        if gsutil ls -b "gs://$${STATE_BUCKET}" >/dev/null 2>&1; then
          echo "✅ Terraform state bucket already exists: gs://$${STATE_BUCKET}"
        else
          echo "🪣 Creating Terraform state bucket: gs://$${STATE_BUCKET}"
          gsutil mb -p "${PROJECT_ID}" -l "${_REGION}" "gs://$${STATE_BUCKET}" || true
          gsutil versioning set on "gs://$${STATE_BUCKET}" >/dev/null || true
        fi
    waitFor: ['push-controlnet','push-modelguard','push-web','push-onnx']

  # Apply full infrastructure via Terraform
  - name: 'hashicorp/terraform:1.5'
    id: 'terraform-apply'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e
        cd infra/terraform
        TF_VARS_FILE="terraform.tfvars"
        if [ "${_ENVIRONMENT}" = "staging" ]; then
          TF_VARS_FILE="terraform.tfvars.staging"
        elif [ "${_ENVIRONMENT}" = "prod" ] || [ "${_ENVIRONMENT}" = "production" ]; then
          TF_VARS_FILE="terraform.tfvars.production"
        fi
        terraform init -reconfigure \
          -backend-config="bucket=${PROJECT_ID}-terraform-state" \
          -backend-config="prefix=terraform/state"
        # Select workspace based on environment
        terraform workspace select ${_ENVIRONMENT} || terraform workspace new ${_ENVIRONMENT}
        # Note: Database is provisioned externally, not managed by Terraform
        terraform apply \
          -var-file="$${TF_VARS_FILE}" \
          -var="project_id=${PROJECT_ID}" \
          -var="environment=${_ENVIRONMENT}" \
          -var="platform_domain=${_PLATFORM_DOMAIN}" \
          -var="image_tag=${_IMAGE_TAG}" \
          -auto-approve
    waitFor: ['ensure-state-bucket']

  - name: 'hashicorp/terraform:1.5'
    id: 'terraform-outputs'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e
        cd infra/terraform
        terraform output || true
    waitFor: ['terraform-apply']

substitutions:
  _REGION: us-central1
  _ENVIRONMENT: dev  # dev, staging, prod (overridden by deploy script)
  _PLATFORM_DOMAIN: demo.kentron.ai  # Your dev domain (overridden by deploy script)
  _IMAGE_TAG: latest  # Use versioned tags for production (overridden by deploy script)

options:
  machineType: 'E2_HIGHCPU_8'  # Fast builds
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'  # 30 minutes

# Secret Manager integration
# Note: Secrets use standard names (no environment suffix) for project-level isolation
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/clerk-publishable-key/versions/latest
      env: 'CLERK_PUBLISHABLE_KEY'
    - versionName: projects/${PROJECT_ID}/secrets/clerk-secret-key/versions/latest
      env: 'CLERK_SECRET_KEY'
    - versionName: projects/${PROJECT_ID}/secrets/database-url/versions/latest
      env: 'DATABASE_URL'

