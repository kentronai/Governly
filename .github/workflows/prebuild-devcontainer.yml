# GitHub Codespaces Prebuild Configuration
# This tells GitHub to prebuild your devcontainer in the background
# Result: 6-minute startup → 10-second startup

name: Prebuild DevContainer

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    # Rebuild every week to keep dependencies fresh
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  prebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve devcontainer image name
        id: devcontainer-image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/devcontainer" >> "$GITHUB_OUTPUT"

      - name: Build and push devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ steps.devcontainer-image.outputs.name }}
          cacheFrom: ${{ steps.devcontainer-image.outputs.name }}
          push: always
          runCmd: |
            # Install Python dependencies
            cd apps/controlnet
            pip install -e .[onnx]
            
            # Install Node dependencies
            cd ../web
            pnpm install
            
            # Verify installations
            python --version
            node --version
            pnpm --version

      - name: Summary
        run: |
          echo "✅ Devcontainer prebuild complete!"
          echo "   Image: ${{ steps.devcontainer-image.outputs.name }}"
          echo "   Next Codespace startup: ~10 seconds"

