name: Deploy to AWS (EC2)

# Provisions (idempotently) and deploys the Kentron platform to a dedicated
# GitHub-Actions EC2 instance (tag: kentron-gha), separate from the legacy
# kentron-production box. The instance is launched with our own deploy key, so
# GitHub Actions SSHes in directly. The runner's SSH ingress is opened just in
# time and revoked afterwards. Triggers on push to main and via workflow_dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws-gha
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  KEY_NAME: kentron-gha-deployer
  INSTANCE_TAG: kentron-gha
  INSTANCE_TYPE: t3.xlarge
  SUBNET_ID: subnet-0f4341e4904a7c9ff
  SG_ID: sg-03f4bb09a4130626d
  EBS_SIZE: "60"
  SSH_USER: ubuntu
  CERT_DOMAIN: app.kentron.ai

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Write deploy key and env files from secrets
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          PROD_ENV: ${{ secrets.PROD_ENV }}
          ENV_OPENAI_LOCAL: ${{ secrets.ENV_OPENAI_LOCAL }}
          ENV_GEMINI_LOCAL: ${{ secrets.ENV_GEMINI_LOCAL }}
          ENV_CLERK_LOCAL: ${{ secrets.ENV_CLERK_LOCAL }}
        run: |
          mkdir -p infra/aws
          printf '%s\n' "$EC2_SSH_KEY" > infra/aws/kentron-deployer.pem
          chmod 400 infra/aws/kentron-deployer.pem
          ssh-keygen -y -f infra/aws/kentron-deployer.pem > infra/aws/deploy_key.pub
          printf '%s' "$PROD_ENV" > .env
          # Deploy the PRODUCTION compose file (lean, self-contained, healthy on a
          # server) instead of docker-compose.dev.yml, which runs dev servers that
          # do runtime npm installs and never settle. Prod compose needs only .env.
          if grep -q '^COMPOSE_FILE=' .env; then
            sed -i 's#^COMPOSE_FILE=.*#COMPOSE_FILE=docker-compose.yml#' .env
          else
            printf '\nCOMPOSE_FILE=docker-compose.yml\n' >> .env
          fi
          # Harmless for prod compose (it ignores them); kept so a future switch
          # back to dev compose still works.
          printf '%s' "$ENV_OPENAI_LOCAL" > .env.openai.local
          printf '%s' "$ENV_GEMINI_LOCAL" > .env.gemini.local
          printf '%s' "$ENV_CLERK_LOCAL" > .env.clerk.local

      - name: Ensure key pair imported
        run: |
          if ! aws ec2 describe-key-pairs --key-names "$KEY_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws ec2 import-key-pair --key-name "$KEY_NAME" \
              --public-key-material fileb://infra/aws/deploy_key.pub --region "$AWS_REGION"
            echo "imported key pair $KEY_NAME"
          else
            echo "key pair $KEY_NAME already exists"
          fi

      - name: Ensure instance exists (find or launch)
        run: |
          IID=$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=$INSTANCE_TAG" \
                      "Name=instance-state-name,Values=running,stopped,pending" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$IID" = "None" ] || [ -z "$IID" ]; then
            AMI=$(aws ssm get-parameter --region "$AWS_REGION" \
              --name /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id \
              --query 'Parameter.Value' --output text)
            echo "launching new instance from $AMI"
            IID=$(aws ec2 run-instances --region "$AWS_REGION" \
              --image-id "$AMI" --instance-type "$INSTANCE_TYPE" --count 1 \
              --key-name "$KEY_NAME" --security-group-ids "$SG_ID" --subnet-id "$SUBNET_ID" \
              --block-device-mappings "[{\"DeviceName\":\"/dev/sda1\",\"Ebs\":{\"VolumeSize\":$EBS_SIZE,\"VolumeType\":\"gp3\"}}]" \
              --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=$INSTANCE_TAG},{Key=Project,Value=kentron}]" \
              --query 'Instances[0].InstanceId' --output text)
          fi
          echo "INSTANCE_ID=$IID" >> "$GITHUB_ENV"
          echo "instance: $IID"
          # Make sure it is running (covers a stopped instance too)
          state=$(aws ec2 describe-instances --instance-ids "$IID" --region "$AWS_REGION" \
            --query 'Reservations[].Instances[].State.Name' --output text)
          if [ "$state" != "running" ]; then
            aws ec2 start-instances --instance-ids "$IID" --region "$AWS_REGION" >/dev/null
          fi
          aws ec2 wait instance-running --instance-ids "$IID" --region "$AWS_REGION"

      - name: Ensure Elastic IP attached
        run: |
          ALLOC=$(aws ec2 describe-addresses --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=$INSTANCE_TAG" \
            --query 'Addresses[0].AllocationId' --output text)
          if [ "$ALLOC" = "None" ] || [ -z "$ALLOC" ]; then
            ALLOC=$(aws ec2 allocate-address --domain vpc --region "$AWS_REGION" \
              --tag-specifications "ResourceType=elastic-ip,Tags=[{Key=Name,Value=$INSTANCE_TAG}]" \
              --query 'AllocationId' --output text)
            echo "allocated EIP $ALLOC"
          fi
          CUR=$(aws ec2 describe-addresses --allocation-ids "$ALLOC" --region "$AWS_REGION" \
            --query 'Addresses[0].InstanceId' --output text)
          if [ "$CUR" != "$INSTANCE_ID" ]; then
            aws ec2 associate-address --instance-id "$INSTANCE_ID" --allocation-id "$ALLOC" \
              --region "$AWS_REGION" >/dev/null
          fi
          IP=$(aws ec2 describe-addresses --allocation-ids "$ALLOC" --region "$AWS_REGION" \
            --query 'Addresses[0].PublicIp' --output text)
          echo "EC2_IP=$IP" >> "$GITHUB_ENV"
          echo "public IP: $IP"

      - name: Open SSH from this runner
        id: sg
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "cidr=${RUNNER_IP}/32" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" --region "$AWS_REGION" \
            2>/dev/null || echo "ingress rule already present"

      - name: Wait for SSH
        run: |
          for i in $(seq 1 40); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 \
                 -i infra/aws/kentron-deployer.pem "$SSH_USER@$EC2_IP" true 2>/dev/null; then
              echo "SSH is up"; exit 0
            fi
            echo "waiting for sshd... ($i)"; sleep 10
          done
          echo "SSH did not come up"; exit 1

      - name: Bootstrap (install Docker if missing)
        run: |
          ssh -o StrictHostKeyChecking=no -i infra/aws/kentron-deployer.pem \
            "$SSH_USER@$EC2_IP" 'bash -s' <<'EOSSH'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          if ! command -v docker >/dev/null 2>&1; then
            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            sudo chmod a+r /etc/apt/keyrings/docker.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release; echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
            sudo apt-get update -y -qq
            sudo apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            sudo systemctl enable --now docker
          fi
          sudo mkdir -p /opt/kentron && sudo chown "$USER":"$USER" /opt/kentron
          docker --version && docker compose version
          EOSSH

      - name: Self-signed TLS so nginx can start (no domain yet)
        run: |
          ssh -o StrictHostKeyChecking=no -i infra/aws/kentron-deployer.pem \
            "$SSH_USER@$EC2_IP" "bash -s $CERT_DOMAIN" <<'EOSSH'
          set -e
          DOMAIN="$1"
          D="/etc/letsencrypt/live/$DOMAIN"
          if [ ! -f "$D/fullchain.pem" ]; then
            sudo mkdir -p "$D"
            sudo openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
              -keyout "$D/privkey.pem" -out "$D/fullchain.pem" -subj "/CN=$DOMAIN"
            echo "self-signed cert created at $D"
          else
            echo "cert already present at $D"
          fi
          EOSSH

      - name: Create external docker volumes (dev compose expects them)
        run: |
          ssh -o StrictHostKeyChecking=no -i infra/aws/kentron-deployer.pem \
            "$SSH_USER@$EC2_IP" '
              sudo docker volume create norix-web-node-modules >/dev/null
              sudo docker volume create norix-web-next-cache >/dev/null
              echo "external volumes ready"'

      - name: Deploy (rsync -> build -> up)
        # deploy.sh brings services up, but its Postgres health-check has a parsing
        # bug (greps the Health field for "postgres") and exits non-zero before
        # migrating. Services are already up at that point, so tolerate it and run
        # migrations explicitly in the next step.
        run: |
          bash infra/aws/deploy.sh "$EC2_IP" || \
            echo "::warning::deploy.sh exited non-zero (known Postgres health-check quirk); services are up, continuing to explicit migration"

      - name: Run database migrations (Drizzle)
        run: |
          ssh -o StrictHostKeyChecking=no -i infra/aws/kentron-deployer.pem \
            "$SSH_USER@$EC2_IP" \
            "cd /opt/kentron && sudo docker run --rm --network controlnet-network \
               --env-file /opt/kentron/.env -e DB_SSL=false -v /opt/kentron:/repo -w /repo \
               node:20-bookworm bash -c 'corepack enable && corepack prepare pnpm@9.0.0 --activate && \
                 pnpm install --no-frozen-lockfile --filter @ai-governance/web... && \
                 cd apps/web && pnpm exec drizzle-kit migrate --config=src/drizzle.config.env.ts'"

      - name: Restart nginx
        run: |
          ssh -o StrictHostKeyChecking=no -i infra/aws/kentron-deployer.pem \
            "$SSH_USER@$EC2_IP" 'cd /opt/kentron && sudo docker compose restart nginx'

      - name: Smoke test
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "http://$EC2_IP/healthz" || true)
            echo "attempt $i: http://$EC2_IP/healthz -> ${code:-timeout}"
            [ "$code" = "200" ] && { echo "APP IS UP at http://$EC2_IP"; exit 0; }
            sleep 10
          done
          echo "app did not return 200 after deploy"; exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "Instance: ${INSTANCE_ID:-?}"
          echo "Public IP: ${EC2_IP:-?}"
          echo "App:  http://${EC2_IP:-?}   https://${EC2_IP:-?} (self-signed)"

      - name: Revoke SSH ingress (always)
        if: always() && steps.sg.outputs.cidr != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "${{ steps.sg.outputs.cidr }}" \
            --region "$AWS_REGION" 2>/dev/null || true
