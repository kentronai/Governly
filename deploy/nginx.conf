# Self-host nginx: same routes as the root nginx.conf, served on plain HTTP :80.
# ponytail: hand-kept copy of ../nginx.conf minus TLS; when you add a route there, add it here.
events {
    worker_connections 1024;
}

http {
    upstream controlnet_backend {
        server controlnet:8000;
    }

    upstream web_frontend {
        server web:8080;
    }

    upstream onnx_service {
        server onnx-service:8002;
    }

    # Self-hosted Nango. The :hosted image serves the API + dashboard on 3003
    # and — with FLAG_SERVE_CONNECT_UI=true — the Connect UI (the popup) on
    # 3009. They are different apps: the popup lives on 3009, not 3003.
    upstream nango_server {
        server nango-server:3003;
    }
    upstream nango_connect {
        server nango-server:3009;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ── HTTP :80 — the application. Put TLS in front (see deploy/README.md). ──
    server {
        listen 80 default_server;
        server_name _;


        # Increase body size (500MB for model uploads)
        client_max_body_size 500M;

        # Nginx health check
        location /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # ModelGuard is not deployed in this environment; fail fast with a
        # clean 503 instead of falling through to the Next.js catch-all.
        location /modelguard/ {
            default_type application/json;
            return 503 '{"error":"model-guard service is not deployed in this environment"}';
        }

        # ONNX Inference Service
        location /infer {
            proxy_pass http://onnx_service/infer;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_set_header X-Accel-Buffering no;
            chunked_transfer_encoding on;
        }

        # ONNX health and stats
        location ~ ^/(health|cache/stats) {
            proxy_pass http://onnx_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ControlNet Gateway API routes
        location /v1/ {
            proxy_pass http://controlnet_backend/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-Policy-ID $http_x_policy_id;
            proxy_set_header X-Model-ID $http_x_model_id;
            proxy_set_header X-API-KEY $http_x_api_key;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;
            chunked_transfer_encoding on;
        }

        # Next.js API routes
        location /api/ {
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
        }

        # ControlNet docs and health
        location ~ ^/(docs|redoc|openapi.json|readyz) {
            proxy_pass http://controlnet_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---- Nango under the app's own origin ----
        # Served here (not a separate host) so the Connect popup + SDK reuse the
        # app's TLS cert. The API is on 3003; the Connect popup is a separate
        # app on 3009 (FLAG_SERVE_CONNECT_UI). Its assets are document-relative,
        # so it works under this sub-path with no root-level routes.
        location /nango-api/ {
            proxy_pass http://nango_server/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
        }
        location /nango-connect/ {
            proxy_pass http://nango_connect/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
        }

        # Everything else → Next.js
        location / {
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
        }
    }
}
